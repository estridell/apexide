[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/estridell/apexide"

[workspace.dependencies]
apexide-core = { path = "crates/apexide-core" }
apexide-daemon = { path = "crates/apexide-daemon" }

[profile.release]
strip = true

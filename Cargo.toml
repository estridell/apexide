[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/estridell/apexkb-rs"

[workspace.dependencies]
apexkb-core = { path = "crates/apexkb-core" }
apexkb-daemon = { path = "crates/apexkb-daemon" }

[profile.release]
strip = true
lto = true
codegen-units = 1

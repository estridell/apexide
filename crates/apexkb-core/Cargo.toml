[package]
name = "apexkb-core"
description = "Device protocol, key layout and OLED rendering for SteelSeries Apex keyboards"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
embedded-graphics = "0.8.2"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "bmp"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
